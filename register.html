<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | CombinedTution</title>
  <meta name="description"
    content="Create an account on CombinedTution. Join Bangladesh's most trusted learning network." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <style>
    /* Exact match to tutoriaa.com/register styling */
    body.tutoriaa-register-body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: 'Poppins', 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      box-sizing: border-box;
    }

    .tutoriaa-register-main {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 3rem 1rem;
      background-color: #f8fafc;
      box-sizing: border-box;
    }

    .tutoriaa-register-box {
      display: flex;
      width: 100%;
      flex-direction: column;
      max-width: 32rem;
      /* max-w-lg */
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tutoriaa-logo-link {
      margin-bottom: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .tutoriaa-logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .tutoriaa-logo-icon svg {
      width: 1.4rem;
      height: 1.4rem;
    }

    .tutoriaa-logo-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .tutoriaa-logo-dot {
      color: #2563eb;
    }

    .tutoriaa-reg-title {
      font-size: 2.25rem;
      /* text-4xl */
      font-weight: 700;
      color: #111827;
      /* text-gray-900 */
      letter-spacing: -0.025em;
      margin: 0;
      line-height: 1.2;
    }

    .tutoriaa-reg-subtitle {
      margin-top: 1rem;
      font-size: 1rem;
      color: #6b7280;
      font-weight: 500;
      line-height: 1.5;
    }

    /* Google Button matching tutoriaa.com/register */
    .tutoriaa-google-wrap {
      margin-top: 2rem;
    }

    .tutoriaa-google-btn {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      background-color: #ffffff;
      transition: all 0.2s;
      font-size: 0.875rem;
      font-weight: 700;
      color: #4b5563;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      font-family: inherit;
    }

    .tutoriaa-google-btn:hover {
      background-color: #f9fafb;
    }

    .tutoriaa-google-icon {
      width: 1.25rem;
      height: 1.25rem;
    }

    /* OR Divider */
    .tutoriaa-divider-wrap {
      margin-top: 1.75rem;
      position: relative;
    }

    .tutoriaa-divider-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
    }

    .tutoriaa-divider-line {
      width: 100%;
      border-top: 1px solid #f3f4f6;
    }

    .tutoriaa-divider-text-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .tutoriaa-divider-text {
      background-color: #f8fafc;
      padding: 0 1rem;
      color: #9ca3af;
    }

    /* Registration Form Fields */
    .tutoriaa-field-group {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .tutoriaa-label {
      font-weight: 700;
      font-size: 0.875rem;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tutoriaa-input {
      margin-top: 0.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 0 0 1px #e5e7eb;
      outline: none;
      padding: 0.875rem 1rem;
      width: 100%;
      transition: all 0.2s;
      background-color: rgba(249, 250, 251, 0.5);
      font-size: 0.925rem;
      color: #111827;
      box-sizing: border-box;
      border: none;
      font-family: inherit;
    }

    .tutoriaa-input:focus {
      background-color: #ffffff;
      box-shadow: 0 0 0 2px #2563eb;
    }

    .role-options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .role-btn {
      padding: 0.75rem 0.5rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      background: #ffffff;
      color: #4b5563;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .role-btn.active {
      border-color: #2563eb;
      background: #ede9fe;
      color: #2563eb;
      font-weight: 700;
    }

    .tutoriaa-submit-btn {
      margin-top: 1.75rem;
      padding: 1rem;
      width: 100%;
      cursor: pointer;
      border-radius: 0.75rem;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.875rem;
      transition: all 0.2s;
      border: none;
      box-shadow: 0 10px 25px -3px rgba(37, 99, 235, 0.25);
      font-family: inherit;
    }

    .tutoriaa-submit-btn:hover {
      background-color: #1d4ed8;
    }

    .tutoriaa-footer-prompt {
      text-align: center;
      padding: 2rem 0;
      font-size: 0.875rem;
      color: #6b7280;
      font-weight: 500;
      margin: 0;
    }

    .tutoriaa-login-link {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .tutoriaa-login-link:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    .password-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .password-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.4rem;
      border-radius: 8px;
      transition: color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .password-toggle-btn:hover {
      color: #2563eb !important;
      background-color: rgba(37, 99, 235, 0.08) !important;
    }

    .password-toggle-btn:active {
      transform: translateY(-50%) scale(0.92) !important;
    }

    .password-toggle-btn:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 1px;
    }
  </style>
</head>

<body class="tutoriaa-register-body">

  <main class="tutoriaa-register-main">
    <div class="tutoriaa-register-box">
      <!-- Logo -->
      <a href="index.html" class="tutoriaa-logo-link">
        <div class="tutoriaa-logo-icon"
          style="width: 3.1rem; height: 3.1rem; border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25); border: 2px solid rgba(37, 99, 235, 0.2); overflow: hidden; background: #faf7f2;">
          <img src="images/logo.jpeg" alt="Combined Tuition Logo"
            style="width: 100%; height: 100%; object-fit: cover; display: block;" />
        </div>
        <span class="tutoriaa-logo-text">CombinedTution<span class="tutoriaa-logo-dot">.</span></span>
      </a>

      <!-- Title & Subtitle matching tutoriaa.com/register -->
      <h2 class="tutoriaa-reg-title">Create Account</h2>
      <p class="tutoriaa-reg-subtitle">Join Bangladesh's most trusted learning network.</p>

      <!-- Google Authentication button matching tutoriaa.com/register -->
      <div class="tutoriaa-google-wrap">
        <div id="g_id_signin_reg" class="g_id_signin_official_box"
          style="display: flex; justify-content: center; margin-bottom: 0.5rem;"></div>
        <button type="button" id="googleRegBtn" class="tutoriaa-google-btn">
          <svg class="tutoriaa-google-icon" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              fill="#EA4335" />
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <!-- OR divider -->
      <div class="tutoriaa-divider-wrap">
        <div class="tutoriaa-divider-bg" aria-hidden="true">
          <div class="tutoriaa-divider-line"></div>
        </div>
        <div class="tutoriaa-divider-text-wrap">
          <span class="tutoriaa-divider-text">OR REGISTER WITH EMAIL</span>
        </div>
      </div>

      <!-- Registration Form -->
      <form id="tutoriaaRegisterForm">
        <div class="tutoriaa-field-group">
          <label class="tutoriaa-label">I am a</label>
          <div class="role-options-grid">
            <button type="button" class="role-btn active" data-role="guardian">Guardian</button>
            <button type="button" class="role-btn" data-role="student">Student</button>
            <button type="button" class="role-btn" data-role="tutor">Tutor</button>
          </div>
          <input type="hidden" id="selectedRole" value="guardian" />
        </div>

        <div class="tutoriaa-field-group">
          <label class="tutoriaa-label" for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="" required class="tutoriaa-input" />
        </div>

        <div class="tutoriaa-field-group">
          <label class="tutoriaa-label" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="" required class="tutoriaa-input" />
        </div>

        <div class="tutoriaa-field-group">
          <label class="tutoriaa-label" for="regPhone">Phone Number</label>
          <input type="tel" id="regPhone" placeholder="" required class="tutoriaa-input" />
        </div>

        <div class="tutoriaa-field-group">
          <label class="tutoriaa-label" for="regPassword">Password</label>
          <div class="password-input-wrap" style="position: relative; display: flex; align-items: center;">
            <input type="password" id="regPassword" placeholder="" required
              minlength="8" class="tutoriaa-input" style="width: 100%; box-sizing: border-box; padding-right: 2.85rem;" />
            <button type="button" id="toggleRegPasswordBtn" class="password-toggle-btn" data-target="regPassword" aria-label="Show password" title="Show password"
              style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; display: flex; align-items: center; justify-content: center; padding: 0.4rem; border-radius: 8px; transition: color 0.2s, background-color 0.2s;">
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
            </button>
          </div>
          <span style="font-size: 0.725rem; color: #6b7280; margin-top: 0.35rem;">Must be at least 8 characters with
            both letters & numbers.</span>
        </div>

        <!-- Error Feedback Box -->
        <div id="regErrorAlert" class="hidden"
          style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.85rem; margin-top: 1rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem;">
          <span id="regErrorMsg"></span>
        </div>

        <button type="submit" id="regSubmitBtn" class="tutoriaa-submit-btn">
          <span>Create Account</span>
        </button>
      </form>

      <!-- Footer prompt matching tutoriaa.com/register -->
      <p class="tutoriaa-footer-prompt">
        Already have an account? <a href="login.html" class="tutoriaa-login-link">Log in</a>
      </p>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const roleBtns = document.querySelectorAll(".role-btn");
      const roleInput = document.getElementById("selectedRole");
      const form = document.getElementById("tutoriaaRegisterForm");
      const submitBtn = document.getElementById("regSubmitBtn");
      const googleBtn = document.getElementById("googleRegBtn");
      const errorAlert = document.getElementById("regErrorAlert");
      const errorMsg = document.getElementById("regErrorMsg");

      function showError(msg) {
        if (!errorAlert || !errorMsg) return;
        errorMsg.textContent = msg;
        errorAlert.classList.remove("hidden");
        errorAlert.style.display = "flex";
      }

      function hideError() {
        if (!errorAlert) return;
        errorAlert.classList.add("hidden");
        errorAlert.style.display = "none";
      }

      roleBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          roleBtns.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          roleInput.value = btn.getAttribute("data-role");
        });
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const phone = document.getElementById("regPhone").value.trim();
        const password = document.getElementById("regPassword").value.trim();
        const role = roleInput.value;

        if (!name || !email || !password) {
          showError("Please fill out all required fields.");
          return;
        }

        if (password.length < 8) {
          showError("Password must be at least 8 characters long.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>Creating account...</span>`;

        try {
          const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, phone, password, role })
          });

          const data = await res.json();

          if (!res.ok) {
            showError(data.error || "Registration failed. Please check your inputs.");
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Create Account</span>`;
            return;
          }

          if (data.token) {
            localStorage.setItem("auth_token", data.token);
          }
          if (data.user) {
            localStorage.setItem("tutoriaa_user", JSON.stringify(data.user));
          }

          showToast(`Welcome to CombinedTution, ${data.user.name}!`);
          setTimeout(() => {
            window.location.href = "index.html";
          }, 600);
        } catch (err) {
          console.error("Registration fetch error:", err);
          showError("Network error: Could not reach the server. Please try again.");
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Create Account</span>`;
        }
      });

      // Google Registration via Verified Google Auth Modal
      if (googleBtn) {
        googleBtn.addEventListener("click", (e) => {
          e.preventDefault();
          const role = roleInput ? roleInput.value : "guardian";
          if (typeof window.openGoogleAuthModal === "function") {
            window.openGoogleAuthModal({ role });
          }
        });
      }
    });
  </script>
  <!-- Google Identity Services (Official Google JS Library) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Verified Google Sign-In Module -->
  <script src="google-auth.js"></script>
</body>

</html>
